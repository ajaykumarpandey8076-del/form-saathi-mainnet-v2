<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Testnet App - Verify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 { color: #5a2d82; }
        p { color: #666; }
        .btn {
            background-color: #5a2d82;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn:hover { background-color: #431f63; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pi Testnet Verification App</h1>
        <p>Welcome! Your app is successfully connected to the Pi Network Testnet environment.</p>
        <a href="#" class="btn">Verify Connection</a>
    </div>
</body>
</html>
